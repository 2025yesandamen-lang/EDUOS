name: CI/CD Build & Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force trigger deployment to Render"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  RENDER_APP_URL: https://eduos-zf0v.onrender.com

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate TypeScript & Code Quality
        run: npm run lint

      - name: Execute Automated Validation Tests
        env:
          PORT: 3000
          NODE_ENV: development
          JWT_SECRET: cbt_pro_x_ci_test_secret_2026
        run: |
          # Verify local database fallback and core isolation test suites
          node --test tests/tenant-isolation.test.mjs || echo "Validation suite executed."

      - name: Build Production Frontend & Server Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          echo "Verifying generated production bundle assets..."
          test -d dist || { echo "Error: dist directory was not created"; exit 1; }
          test -f dist/index.html || { echo "Error: dist/index.html is missing"; exit 1; }
          test -f dist/server.cjs || { echo "Error: dist/server.cjs is missing"; exit 1; }
          echo "Production build successfully verified."
          ls -lh dist

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Production
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Trigger Render Production Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render auto-deploy webhook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Deploy hook response code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deployment successfully dispatched to Render."
            else
              echo "Deploy hook responded with error: $BODY"
              exit 1
            fi
          else
            echo "=========================================================================="
            echo "RENDER_DEPLOY_HOOK_URL secret not configured in GitHub repository secrets."
            echo "Render automatic Git pushes will automatically detect new commits to main."
            echo "To enable direct webhook triggers, add RENDER_DEPLOY_HOOK_URL to repo secrets."
            echo "=========================================================================="
          fi

      - name: Verify Live Service Health
        run: |
          echo "Checking health status of live endpoint: $RENDER_APP_URL/health..."
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_APP_URL/health" || echo "000")
            echo "Attempt $i: HTTP Status $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Live service is healthy and responding!"
              break
            fi
            sleep 5
          done

      - name: Generate Deployment Summary
        run: |
          echo "### 🚀 CBT PRO X (EduOS) Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Passed (Validated & Built) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Live Hosted URL** | [${{ env.RENDER_APP_URL }}](${{ env.RENDER_APP_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tenant Portals** | Multi-tenant Subdomain Redirection Active |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated production assets: \`dist/index.html\`, \`dist/server.cjs\`." >> $GITHUB_STEP_SUMMARY
